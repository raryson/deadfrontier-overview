<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeadFrontier Overview</title><link rel="stylesheet" href="app.css"></head><body>
<div class="app-shell"><aside class="app-rail"><div class="rail-mark">DF<span>OVERVIEW</span></div><p class="rail-caption" data-text="navCaption"></p><nav aria-label="Overview"><button class="nav-button active" data-section="live"><span>01</span><b data-text="navOverview"></b></button><button class="nav-button" data-section="loot"><span>02</span><b data-text="navLoot"></b></button><button class="nav-button" data-section="history"><span>03</span><b data-text="history"></b></button><button class="nav-button" data-section="market"><span>04</span><b data-text="priceTitle"></b></button><button class="nav-button" data-section="settings"><span>05</span><b data-text="navSettings"></b></button></nav><div class="rail-foot"><i></i><span data-text="localData"></span></div></aside><main>
  <header><div class="brand"><img src="../../icon.png" width="44" height="44" alt="DF"><div><span class="eyebrow" data-text="desktop"></span><h1>DeadFrontier <span>Overview</span></h1><p class="page-subtitle" data-text="overviewSubtitle"></p></div></div><label><span data-text="language"></span><select id="language"><option value="auto">Auto</option><option value="pt">Português</option><option value="en">English</option></select></label></header>
  <section class="status-card" id="live"><div><span class="status-dot" id="dot"></span><strong id="phase"></strong></div><p id="game" class="muted"></p><p id="detail" class="muted"></p><div class="switches"><label><input id="auto" type="checkbox"><span data-text="auto"></span></label><label><input id="overlay" type="checkbox"><span data-text="overlay"></span></label></div><p class="muted" data-text="privacy"></p><p id="test" class="demo" hidden data-text="test"></p></section>
  <section class="xp-card"><div class="section-heading"><h2 data-text="xpTitle"></h2><span id="session-state" class="badge"></span></div><div class="metrics"><div><span data-text="xpGained"></span><strong id="gained">—</strong></div><div><span data-text="xpRate"></span><strong id="rate">—</strong></div><div><span data-text="xpBase"></span><strong id="base">—</strong></div><div><span data-text="xpBaseRate"></span><strong id="base-rate">—</strong></div><div><span data-text="elapsed"></span><strong id="elapsed">—</strong></div><div><span data-text="lost"></span><strong id="lost">—</strong></div></div><p id="current" class="muted"></p><p id="precision" class="muted"></p><p class="muted" data-text="autoHint"></p><div class="actions"><button id="stop" data-text="stop"></button><button id="reset" class="primary" data-text="reset"></button></div></section>
  <section class="loot-card" id="loot"><div class="section-heading"><h2 data-text="lootTitle"></h2><span id="loot-count" class="badge"></span></div><div class="metrics"><div><span data-text="priceCash"></span><strong id="loot-cash">—</strong></div><div><span data-text="priceEstimate"></span><strong id="loot-estimate">—</strong></div><div><span data-text="priceMissing"></span><strong id="loot-unpriced">—</strong></div></div><p class="muted" data-text="priceValuationHint"></p><p id="loot-pending" class="loot-activity" aria-live="polite"></p><p class="muted" data-text="lootHint"></p><p id="loot-empty" class="muted" data-text="lootEmpty"></p><div class="table-scroll"><table><thead><tr><th data-text="date"></th><th data-text="lootItem"></th><th data-text="status"></th><th data-text="priceTotal"></th></tr></thead><tbody id="loot-rows"></tbody></table></div></section>
  <section class="history-card" id="history"><div class="section-heading"><h2 data-text="history"></h2><div><span class="badge" id="count">0</span> <button id="export" data-text="export"></button></div></div><p class="muted" data-text="historyHint"></p><p id="empty" data-text="empty"></p><div class="table-scroll"><table><thead><tr><th data-text="date"></th><th data-text="xpGained"></th><th data-text="xpRate"></th><th data-text="duration"></th><th data-text="xpBase"></th><th data-text="xpBaseRate"></th><th data-text="lost"></th><th data-text="lootSession"></th><th data-text="priceTotal"></th><th data-text="status"></th></tr></thead><tbody id="sessions"></tbody></table></div></section>
  <section id="market"><div class="section-heading"><h2 data-text="priceTitle"></h2><span class="badge" id="price-direct-state"></span></div><p class="muted" data-text="priceHint"></p><p id="price-last-sync" class="muted"></p><label><span data-text="priceMarket"></span><select id="price-market"></select></label><p id="price-query-status" role="status" class="muted"></p><form id="price-query-form" class="inline-form"><label><span data-text="priceQueryName"></span><input id="price-query-name" list="price-item-names" maxlength="120" required placeholder="Gasoline"><datalist id="price-item-names"></datalist></label><label><input type="checkbox" id="price-query-custom"><span data-text="priceQueryCustom"></span></label><button class="primary" data-text="priceQuery"></button></form><p data-text="priceDirectHint" class="muted"></p><button id="price-refresh" data-text="priceRefresh"></button><details><summary data-text="priceOptionalBridge"></summary><p class="muted" data-text="priceOptionalHint"></p><p id="price-bridge-state" class="muted"></p><div class="actions"><button id="price-pair" data-text="pricePair"></button><button id="price-disconnect" data-text="priceDisconnect"></button></div><output id="price-code" class="pair-code" hidden></output><p id="price-code-hint" class="muted" hidden data-text="priceCodeHint"></p></details><details><summary data-text="priceAliasTitle"></summary><p class="muted" data-text="priceAliasHint"></p><form id="price-alias-form" class="inline-form"><label><span data-text="priceOcrName"></span><select id="price-alias-from"></select></label><label><span data-text="priceMarketName"></span><select id="price-alias-target"></select></label><button id="price-alias-submit" data-text="priceAliasSave"></button></form></details><details><summary data-text="priceCatalogTitle"></summary><div class="table-scroll"><table><thead><tr><th data-text="lootItem"></th><th data-text="priceUnit"></th><th data-text="priceSource"></th><th data-text="priceObserved"></th></tr></thead><tbody id="price-catalog"></tbody></table></div></details></section>
  <details id="settings"><summary data-text="settings"></summary><div class="settings-body"><form id="factor-form" class="inline-form"><label><span data-text="xpMultiplier"></span><input id="factor" type="number" min="0.001" max="1000" step="any" placeholder="4.2"></label><button data-text="xpApplyMultiplier"></button></form><form id="process-form"><label><span data-text="process"></span><input id="process" maxlength="80" placeholder="DeadFrontier"></label><p class="muted" data-text="processHint"></p><button data-text="saveProcess"></button></form><div class="inline-form"><label><span data-text="window"></span><select id="windows"></select></label><button id="select-window" data-text="selectWindow"></button></div><details id="calibration"><summary data-text="calibration"></summary><p class="muted" data-text="cropHelp"></p><div class="actions"><button id="preview-button" data-text="preview"></button><button id="default-region" data-text="defaultCrop"></button></div><canvas id="preview" hidden></canvas></details><div class="data-management"><h3 data-text="dataTitle"></h3><p class="muted" data-text="clearHistoryHint"></p><button id="clear-history" class="danger" data-text="clearHistory"></button></div></div></details>
  <footer><p data-text="tray"></p><button id="quit" data-text="quit"></button></footer>
</main></div><p id="error" role="status" hidden></p><script type="module" src="renderer.mjs"></script></body></html>
