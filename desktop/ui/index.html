<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DeadFrontier Overview</title><link rel="stylesheet" href="app.css"></head><body>
<main>
  <header><div class="brand"><img src="../../icon.png" width="44" height="44" alt="DF"><div><span class="eyebrow" data-text="desktop"></span><h1>DeadFrontier <span>Overview</span></h1></div></div><label><span data-text="language"></span><select id="language"><option value="auto">Auto</option><option value="pt">Português</option><option value="en">English</option></select></label></header>
  <section class="status-card"><div><span class="status-dot" id="dot"></span><strong id="phase"></strong></div><p id="game" class="muted"></p><p id="detail" class="muted"></p><div class="switches"><label><input id="auto" type="checkbox"><span data-text="auto"></span></label><label><input id="overlay" type="checkbox"><span data-text="overlay"></span></label></div><p class="muted" data-text="privacy"></p><p id="test" class="demo" hidden data-text="test"></p></section>
  <section><div class="section-heading"><h2 data-text="xpTitle"></h2><span id="session-state" class="badge"></span></div><div class="metrics"><div><span data-text="xpGained"></span><strong id="gained">—</strong></div><div><span data-text="xpRate"></span><strong id="rate">—</strong></div><div><span data-text="xpBase"></span><strong id="base">—</strong></div><div><span data-text="xpBaseRate"></span><strong id="base-rate">—</strong></div><div><span data-text="elapsed"></span><strong id="elapsed">—</strong></div><div><span data-text="lost"></span><strong id="lost">—</strong></div></div><p id="current" class="muted"></p><p id="precision" class="muted"></p><p class="muted" data-text="autoHint"></p><div class="actions"><button id="stop" data-text="stop"></button><button id="reset" class="primary" data-text="reset"></button></div><form id="factor-form" class="inline-form"><label><span data-text="xpMultiplier"></span><input id="factor" type="number" min="0.001" max="1000" step="any" placeholder="4.2"></label><button data-text="xpApplyMultiplier"></button></form></section>
  <section><div class="section-heading"><h2 data-text="history"></h2><div><span class="badge" id="count">0</span> <button id="export" data-text="export"></button></div></div><p class="muted" data-text="historyHint"></p><p id="empty" data-text="empty"></p><div class="table-scroll"><table><thead><tr><th data-text="date"></th><th data-text="xpGained"></th><th data-text="xpRate"></th><th data-text="duration"></th><th data-text="xpBase"></th><th data-text="xpBaseRate"></th><th data-text="lost"></th><th data-text="lootSession"></th><th data-text="status"></th></tr></thead><tbody id="sessions"></tbody></table></div></section>
  <section><div class="section-heading"><h2 data-text="lootTitle"></h2><span id="loot-count" class="badge"></span></div><p id="loot-pending" class="muted"></p><p class="muted" data-text="lootHint"></p><p id="loot-empty" class="muted" data-text="lootEmpty"></p><div class="table-scroll"><table><thead><tr><th data-text="date"></th><th data-text="lootItem"></th><th data-text="status"></th></tr></thead><tbody id="loot-rows"></tbody></table></div></section>
  <details id="settings"><summary data-text="settings"></summary><div class="settings-body"><form id="process-form"><label><span data-text="process"></span><input id="process" maxlength="80" placeholder="DeadFrontier"></label><p class="muted" data-text="processHint"></p><button data-text="saveProcess"></button></form><div class="inline-form"><label><span data-text="window"></span><select id="windows"></select></label><button id="select-window" data-text="selectWindow"></button></div><details id="calibration"><summary data-text="calibration"></summary><p class="muted" data-text="cropHelp"></p><div class="actions"><button id="preview-button" data-text="preview"></button><button id="default-region" data-text="defaultCrop"></button></div><canvas id="preview" hidden></canvas></details></div></details>
  <footer><p data-text="tray"></p><button id="quit" data-text="quit"></button></footer>
</main><p id="error" role="status" hidden></p><script type="module" src="renderer.mjs"></script></body></html>
